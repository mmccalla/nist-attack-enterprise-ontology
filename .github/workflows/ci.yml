name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ontology:
    name: Ontology gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"  # the version that requirements-dev.txt is locked with
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js (shared gap logic and its tests)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install development dependencies (hash-checked)
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Audit Python dependencies for known vulnerabilities
        run: pip-audit -r requirements-dev.txt --require-hashes --progress-spinner off

      - name: Download pinned sources and check the population is up to date
        run: python scripts/build_population.py --check

      - name: Check index.html is built from the current sources
        run: python scripts/build_graph.py --check

      - name: Check exports are built from the current sources
        run: python scripts/build_exports.py --check

      - name: Check the agent API is built from the current sources
        run: python scripts/build_api.py --check

      - name: Run the evaluation gates (conformance, alignment, consistency, competency)
        run: java -version && python -m pytest -q tests

  browser:
    name: Browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python (poisoned test page)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"  # the version that requirements-dev.txt is locked with

      - name: Install dependencies
        run: |
          npm ci
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Build a page from poisoned data (security probe)
        run: python scripts/build_graph.py --poisoned "$RUNNER_TEMP/poisoned.html"

      - name: Run browser checks, including the security probes
        run: npm run uat
        env:
          POISONED_PAGE: ${{ runner.temp }}/poisoned.html
