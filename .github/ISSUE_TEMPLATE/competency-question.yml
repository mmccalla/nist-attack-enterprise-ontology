name: Competency question
description: A question the graph should be able to answer
labels: [competency-question]
body:
  - type: input
    id: persona
    attributes: {label: Who asks it?, placeholder: "Cloud platform engineer"}
    validations: {required: true}
  - type: textarea
    id: question
    attributes: {label: Question}
    validations: {required: true}
  - type: textarea
    id: decision
    attributes: {label: What decision does the answer support?}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: What evidence would answer it?, description: "CTID mappings, ATT&CK STIX, OSCAL, something else"}
