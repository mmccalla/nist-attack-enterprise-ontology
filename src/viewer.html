<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1f; --muted: #5a5a60; --line: #d9d9de;
  --accent: #2457c5; --focus: #ffbf47; --hover: #eef2fb;
  --control: #2457c5; --technique: #b42318; --group: #6d3fc0; --claim: #0b7a52;
  --assertion: #b45309; --nonmap: #5f6b7a; --vocab: #0e7490; --dataset: #3f4a5a;
  --tactic: #a3367a; --platform: #0e7490; --mitigation: #6b5a00; --baseline: #1f6f8b;
  --atlas: #7a3e00; --atlasm: #4d6b00; --owasp: #9b1c5a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141417; --panel: #1d1d22; --ink: #ececf0; --muted: #a6a6b0; --line: #34343c;
    --accent: #8db1ff; --hover: #262c3a;
    --control: #7fa6ff; --technique: #ff8a7a; --group: #b79bff; --claim: #4fd1a1;
    --assertion: #f6b35b; --nonmap: #a9b4c2; --vocab: #5fd0e6; --dataset: #b6c0cf;
    --tactic: #f08cc8; --platform: #5fd0e6; --mitigation: #e2c94a; --baseline: #7cc6e0;
    --atlas: #f2a65a; --atlasm: #b5d86a; --owasp: #f58bbd;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); display: grid; grid-template-rows: auto 1fr; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 8px; top: 8px; background: var(--panel); padding: 6px 10px; z-index: 10; }
header { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 17px; margin: 0; }
header p { margin: 0; color: var(--muted); font-size: 13px; }
header nav { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.btn { font: inherit; padding: 5px 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--hover); }
.btn[aria-current="page"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
main { display: grid; grid-template-columns: 300px 1fr 360px; min-height: 0; }
aside, #detail { background: var(--panel); overflow: auto; min-height: 0; }
aside { border-right: 1px solid var(--line); padding: 12px; }
#detail { border-left: 1px solid var(--line); padding: 14px 16px; }
#stage { position: relative; min-height: 0; min-width: 0; }
#graph { width: 100%; height: 100%; display: block; }
label.field { display: block; font-weight: 600; margin: 0 0 4px; }
input[type="search"] { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.tabs { display: flex; gap: 4px; margin: 12px 0 8px; flex-wrap: wrap; }
.tabs button { font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent); }
ul.list { list-style: none; margin: 0; padding: 0; }
ul.list li a { display: flex; gap: 8px; align-items: baseline; padding: 4px 6px; border-radius: 5px; text-decoration: none; color: var(--ink); }
ul.list li a:hover { background: var(--hover); }
ul.list li a[aria-current="true"] { background: var(--hover); font-weight: 600; }
.id { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 68px; }
.sub { color: var(--muted); flex: 1; }
.count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 12.5px; }
.badge { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 10px; border: 1px solid currentColor; }
h2 { font-size: 18px; margin: 4px 0 2px; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; margin: 0; font-size: 13px; }
dt { color: var(--muted); }
dd { margin: 0; word-break: break-word; }
blockquote { margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--assertion); background: var(--bg); font-size: 13px; }
details summary { cursor: pointer; font-weight: 600; margin: 8px 0 4px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
code { font-size: 12px; }
pre { white-space: pre-wrap; font-size: 12px; background: var(--bg); padding: 8px; border-radius: 6px; overflow: auto; }
.warn { border-left: 3px solid var(--technique); padding: 4px 8px; background: var(--bg); font-size: 13px; }
:root { --good: #0ca30c; --warning: #fab219; --none: #d5d9df; }
#report { position: absolute; inset: 0; overflow: auto; padding: 16px 20px; background: var(--bg); }
#report[hidden] { display: none; }
textarea { width: 100%; min-height: 110px; font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
.bar { display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: var(--line); min-width: 160px; }
.bar span { display: block; height: 100%; border-right: 2px solid var(--bg); }
.bar span:last-child { border-right: 0; }
.s-good { background: var(--good); } .s-gap { background: var(--warning); } .s-none { background: var(--none); }
.key { display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; font-size: 12.5px; }
.key i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.stat { display: inline-block; margin: 0 18px 8px 0; } .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.cov td { white-space: nowrap; } .cov td.num { text-align: right; font-variant-numeric: tabular-nums; }
#legend { position: absolute; left: 10px; bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: calc(100% - 20px); }
#legend span { display: inline-flex; align-items: center; gap: 4px; }
#toolbar { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
#toolbar > * { pointer-events: auto; }
#crumb { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
#toolbar label { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 13px; }
svg text { fill: var(--ink); font-size: 11px; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
svg .edge { stroke: var(--muted); stroke-opacity: .45; }
svg .edge-label { font-size: 9.5px; fill: var(--muted); }
svg .node { cursor: pointer; }
svg .node:focus { outline: none; }
svg .node:focus-visible path, svg .node.focus path { stroke: var(--focus); stroke-width: 4px; }
svg .node path { stroke: var(--panel); stroke-width: 1.5px; }
svg .node.dim path { opacity: .35; }
@media (max-width: 1100px) {
  main { grid-template-columns: 260px 1fr; grid-template-rows: 1fr auto; }
  #detail { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; }
}
@media (max-width: 720px) {
  main { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto; }
  aside { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
}

<header>
  <h1>NIST 800-53 Rev. 5 to MITRE ATT&amp;CK Enterprise ontology</h1>
  <p id="subtitle"></p>
  <nav aria-label="Views">
    <a class="btn" href="#overview" data-view="overview">Overview</a>
    <a class="btn" href="#gaps" data-view="gaps">Gap analysis</a>
    <a class="btn" href="#questions" data-view="questions">Questions</a>

  </nav>
</header>
<main>
  <aside aria-label="Browse">
    <label class="field" for="q">Search controls, techniques, tactics and mitigations</label>
    <input id="q" type="search" placeholder="AC-02, T1078, phishing, M1032" autocomplete="off">
    <div class="tabs" role="tablist" aria-label="Browse lists">
      <button role="tab" id="tab-groups" aria-controls="browse" aria-selected="true" data-tab="groups">Groups</button>
      <button role="tab" id="tab-controls" aria-controls="browse" aria-selected="false" data-tab="controls">Controls</button>
      <button role="tab" id="tab-techniques" aria-controls="browse" aria-selected="false" data-tab="techniques">Techniques</button>
      <button role="tab" id="tab-tactics" aria-controls="browse" aria-selected="false" data-tab="tactics">Tactics</button>
      <button role="tab" id="tab-atlas" aria-controls="browse" aria-selected="false" data-tab="atlas">AI and agents</button>
      <button role="tab" id="tab-classes" aria-controls="browse" aria-selected="false" data-tab="classes">Classes</button>
    </div>
    <div id="browse" role="tabpanel" aria-live="polite"></div>
  </aside>
  <section id="stage" aria-label="Graph">
    <div id="toolbar">
      <div id="crumb" aria-live="polite"></div>
      <label><input type="checkbox" id="prov" checked> Show source rows and claims</label>
    </div>
    <svg id="graph" role="img" aria-labelledby="graph-desc"><desc id="graph-desc">Graph of the selected node and its neighbours. Use the lists and the details panel for keyboard navigation.</desc></svg>
    <div id="legend" aria-label="Legend"></div>
    <div id="report" hidden aria-live="polite"></div>
  </section>
  <section id="detail" aria-label="Details" tabindex="-1"></section>

<script>/*__D3__*/</script>
<script>/*__COVERAGE__*/</script>
<script>
"use strict";
const DATA = /*__GRAPH_DATA__*/;
const NODES = DATA.nodes;
const BY_ID = new Map(NODES.map(n => [n.id, n]));
const OUT = new Map(), IN = new Map();
for (const n of NODES) { OUT.set(n.id, []); IN.set(n.id, []); }
for (const [s, pi, o] of DATA.edges) {
  const p = DATA.predicates[pi];
  OUT.get(NODES[s].id).push([p, NODES[o].id]);
  IN.get(NODES[o].id).push([p, NODES[s].id]);
}
const PROPS = new Map(DATA.schema.properties.map(p => [p.id, p]));
const TYPES = {
  SecurityControl: ["Security control", "control", d3.symbolCircle, 260],
  AttackTechnique: ["ATT&CK technique", "technique", d3.symbolSquare, 200],
  CapabilityGroup: ["Capability group", "group", d3.symbolStar, 520],
  MitigationClaim: ["Mitigation claim", "claim", d3.symbolDiamond, 150],
  MitigatesAssertion: ["Mitigates assertion (source row)", "assertion", d3.symbolTriangle, 150],
  NonMappableAssertion: ["Non-mappable assertion (source row)", "nonmap", d3.symbolTriangle, 150],
  Tactic: ["ATT&CK tactic", "tactic", d3.symbolWye, 360],
  AttackMitigation: ["ATT&CK mitigation", "mitigation", d3.symbolDiamond, 260],
  Platform: ["Platform", "platform", d3.symbolSquare, 140],
  ControlBaseline: ["Control baseline (OSCAL)", "baseline", d3.symbolStar, 360],
  CybersecurityMappingDataset: ["Mapping dataset", "dataset", d3.symbolCross, 360],
  ReferenceDataset: ["Reference dataset", "dataset", d3.symbolCross, 300],
  DatasetMetadataRecord: ["Dataset metadata record", "dataset", d3.symbolCross, 260],
  LaterVersionRecord: ["Change in a later ATT&CK version", "vocab", d3.symbolTriangle, 200],
  AtlasTechnique: ["ATLAS technique", "atlas", d3.symbolSquare, 220],
  AtlasMitigation: ["ATLAS mitigation", "atlasm", d3.symbolDiamond, 260],
  OwaspRisk: ["OWASP risk", "owasp", d3.symbolTriangle, 280],
};
const PROVENANCE = new Set(["MitigationClaim", "MitigatesAssertion", "NonMappableAssertion"]);
const MAX_NEIGHBOURS = 160;
const color = t => getComputedStyle(document.documentElement).getPropertyValue("--" + TYPES[t][1]).trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const link = id => { const n = BY_ID.get(id); return `<a href="#n/${encodeURIComponent(id)}">${esc(n.l)}</a>${n.s ? ` <span class="sub">${esc(n.s)}</span>` : ""}`; };
const ofType = t => NODES.filter(n => n.t === t);
const mitigated = id => OUT.get(id).filter(([p]) => p === ":mitigatesTechnique").length;
const mitigatedBy = id => IN.get(id).filter(([p]) => p === ":mitigatesTechnique").length;
const isNonMappable = id => IN.get(id).some(([p, s]) => p === ":assertsTechnique" && BY_ID.get(s).t === "NonMappableAssertion");
const hasRow = id => IN.get(id).some(([p]) => p === ":assertsTechnique");
const atlasMitigationsOf = id => IN.get(id).filter(([p]) => p === ":atlasMitigationFor").map(([, s]) => s);
const atlasParentMitigated = id => OUT.get(id).some(([p, o]) => p === ":subTechniqueOf" && atlasMitigationsOf(o).length);
const QUESTIONS = DATA.questions;
const byLabel = (a, b) => a.l.localeCompare(b.l, "en", {numeric: true});

/* Header and legend */
const M = DATA.meta, C = M.counts;
const SC = M.sourceCounts;
document.getElementById("subtitle").textContent =
  `Ontology ${M.version}. Full CTID source: ${SC.sourceRows} rows, ${SC.claims} claims. ATT&CK ${M.source.attackVersion} Enterprise: ${SC.techniquesInAttackEnterprise} techniques. Aligned to ATT&CK STIX, NIST OSCAL and UCO. AI coverage: MITRE ATLAS ${DATA.meta.atlasVersion} and OWASP GenAI.`;
document.getElementById("legend").innerHTML = Object.entries(TYPES)
  .filter(([t]) => !["ReferenceDataset", "DatasetMetadataRecord", "Platform"].includes(t))
  .map(([t, [name, , sym]]) => `<span><svg width="14" height="14" aria-hidden="true"><path transform="translate(7,7)" d="${d3.symbol(sym, 70)()}" fill="${color(t)}"/></svg>${esc(name)}</span>`).join("");

/* Browse lists */
let tab = "groups";
const browse = document.getElementById("browse");
const q = document.getElementById("q");
function listItems(items, current) {
  return `<ul class="list">${items.map(n => `<li><a href="#n/${encodeURIComponent(n.id)}"${n.id === current ? ' aria-current="true"' : ""}><span class="id">${esc(n.l)}</span><span class="sub">${esc(n.s ?? "")}</span><span class="count">${n.c ?? ""}</span></a></li>`).join("")}</ul>`;
}
function renderBrowse() {
  const current = route().id;
  const term = q.value.trim().toLowerCase();
  if (term) {
    const hits = NODES.filter(n => ["SecurityControl", "AttackTechnique", "CapabilityGroup", "Tactic", "AttackMitigation", "AtlasTechnique", "AtlasMitigation", "OwaspRisk"].includes(n.t))
      .filter(n => (n.l + " " + (n.s ?? "")).toLowerCase().includes(term)).sort(byLabel);
    browse.innerHTML = `<p class="note">${hits.length} match${hits.length === 1 ? "" : "es"}${hits.length > 100 ? ", first 100 shown" : ""}.</p>` + listItems(hits.slice(0, 100), current);
    return;
  }
  if (tab === "groups") {
    browse.innerHTML = `<p class="note">Count: controls in the group.</p>` + listItems(ofType("CapabilityGroup").sort(byLabel)
      .map(n => ({...n, c: OUT.get(n.id).filter(([p]) => p === ":hasMemberControl").length || IN.get(n.id).filter(([p]) => p === ":inCapabilityGroup").length})), current);
  } else if (tab === "controls") {
    browse.innerHTML = `<p class="note">Count: techniques mitigated in the sample.</p>` + listItems(ofType("SecurityControl").sort(byLabel).map(n => ({...n, c: mitigated(n.id)})), current);
  } else if (tab === "techniques") {
    const filter = document.getElementById("tech-filter")?.value ?? "all";
    const items = ofType("AttackTechnique").sort(byLabel)
      .map(n => ({...n, c: n.p[":inAttackEnterprise"] === "false" ? "not in Enterprise" : mitigatedBy(n.id) || (isNonMappable(n.id) ? "n/m" : hasRow(n.id) ? "" : "no row")}))
      .filter(n => filter === "all" || (filter === "claims" && typeof n.c === "number") || (filter === "nm" && n.c === "n/m") || (filter === "none" && n.c === "no row") || (filter === "outside" && n.c === "not in Enterprise"));
    browse.innerHTML = `<label class="note" for="tech-filter">Show</label> <select id="tech-filter">
      ${[["all", "All techniques"], ["claims", "With mitigation claims"], ["nm", "Non-mappable in the source"], ["none", "Not in the mapping (CQ12)"], ["outside", "Not in ATT&CK Enterprise (CQ08)"]].map(([v, l]) => `<option value="${v}"${v === filter ? " selected" : ""}>${l}</option>`).join("")}
      </select> <span class="note">${items.length} shown</span>
      <p class="note">Count: mitigating controls. n/m: the source marks it non-mappable. no row: the mapping does not mention it.</p>` + listItems(items, current);
    document.getElementById("tech-filter").addEventListener("change", renderBrowse);
  } else if (tab === "tactics") {
    const items = ofType("Tactic").filter(n => (n.p.catalogue ?? "").startsWith("ATT&CK")).sort((a, b) => +a.p[":tacticOrder"] - +b.p[":tacticOrder"]).map(n => ({...n, c: IN.get(n.id).filter(([p]) => p === ":inTactic").length}));
    browse.innerHTML = `<p class="note">ATT&amp;CK matrix order. Count: Enterprise techniques in the tactic.</p>` + listItems(items, current);
  } else if (tab === "atlas") {
    const filter = document.getElementById("atlas-filter")?.value ?? "agent";
    const items = ofType("AtlasTechnique").sort(byLabel).map(n => ({...n, c: atlasMitigationsOf(n.id).length}))
      .filter(n => filter === "all" || (filter === "agent" && n.p[":isAgentRelated"] === "true") || (filter === "none" && n.p[":isAgentRelated"] === "true" && !atlasMitigationsOf(n.id).length && !atlasParentMitigated(n.id)));
    const risks = ofType("OwaspRisk").sort(byLabel).map(n => ({...n, c: OUT.get(n.id).filter(([p]) => p === ":relatedAtlasTechnique").length || ""}));
    browse.innerHTML = `<label class="note" for="atlas-filter">MITRE ATLAS techniques</label> <select id="atlas-filter">
      ${[["agent", "Techniques against AI agents"], ["none", "Agent techniques with no mitigation (CQ16)"], ["all", "All ATLAS techniques"]].map(([v, l]) => `<option value="${v}"${v === filter ? " selected" : ""}>${l}</option>`).join("")}
      </select> <span class="note">${items.length} shown. Count: ATLAS mitigations.</span>` + listItems(items, current)
      + `<h3>OWASP GenAI risks</h3><p class="note">Count: ATLAS techniques that OWASP links to the risk.</p>` + listItems(risks, current);
    document.getElementById("atlas-filter").addEventListener("change", renderBrowse);
  } else {
    browse.innerHTML = `<p class="note">Open a class in the schema view.</p><ul class="list">${DATA.schema.classes.map(c =>
      `<li><a href="#class/${encodeURIComponent(c.id)}"${current === c.id ? ' aria-current="true"' : ""}><span class="id">${esc(c.label ?? c.id)}</span><span class="count">${C[c.id.replace(/^:/, "")] ?? ""}</span></a></li>`).join("")}</ul>`;
  }
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", String(x === b)));
  q.value = ""; renderBrowse();
}));
q.addEventListener("input", renderBrowse);

/* Graph */
const svg = d3.select("#graph");
const root = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.2, 5]).on("zoom", e => root.attr("transform", e.transform)));
let sim;
function draw(nodes, links, focusId, opts = {}) {
  if (sim) sim.stop();
  root.selectAll("*").remove();
  svg.call(d3.zoom().transform, d3.zoomIdentity);
  const {width, height} = document.getElementById("graph").getBoundingClientRect();
  const showLabels = nodes.length <= 90 || opts.labels;
  const link = root.append("g").selectAll("line").data(links).join("line").attr("class", "edge");
  const edgeLabels = links.length <= 16 ? root.append("g").selectAll("text").data(links).join("text").attr("class", "edge-label").attr("text-anchor", "middle").text(d => d.label) : null;
  const node = root.append("g").selectAll("g").data(nodes).join("g")
    .attr("class", d => "node" + (d.id === focusId ? " focus" : "") + (d.dim ? " dim" : ""))
    .attr("tabindex", 0).attr("role", "link")
    .attr("aria-label", d => `${(TYPES[d.t] ?? ["Class"])[0]}: ${d.l}${d.s ? ", " + d.s : ""}`)
    .on("click", (e, d) => { location.hash = d.href; })
    .on("keydown", (e, d) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); location.hash = d.href; } });
  node.append("path")
    .attr("d", d => d3.symbol(d.sym ?? TYPES[d.t][2], d.size ?? TYPES[d.t][3] * (d.id === focusId ? 2.2 : 1))())
    .attr("fill", d => d.fill ?? color(d.t));
  node.append("title").text(d => `${d.l}${d.s ? ": " + d.s : ""}`);
  node.filter(d => showLabels || d.id === focusId || d.label).append("text").attr("x", 10).attr("y", 4).text(d => d.short ?? d.l);
  node.call(d3.drag()

const nodeView = n => ({id: n.id, t: n.t, l: n.l, s: n.s, href: "n/" + encodeURIComponent(n.id)});
const EXTERNAL_LABELS = {"prov:wasDerivedFrom": "was derived from", "skos:inScheme": "in scheme"};
const propLabel = p => PROPS.get(p)?.label ?? EXTERNAL_LABELS[p] ?? p.replace(/^[a-z]*:/, "");
const radius = size => Math.sqrt(size / Math.PI);

function neighbourhood(id) {
  const showProv = document.getElementById("prov").checked || PROVENANCE.has(BY_ID.get(id).t);
  const pairs = [...OUT.get(id).map(([p, o]) => [id, p, o]), ...IN.get(id).map(([p, s]) => [s, p, id])];
  const keep = pairs.filter(([s, , o]) => showProv || !PROVENANCE.has(BY_ID.get(s === id ? o : s).t));
  // Direct neighbours first, then claims and source rows, so a capped view keeps the controls and techniques.
  const ids = [...new Set(keep.map(([s, , o]) => (s === id ? o : s)))]
    .sort((a, b) => PROVENANCE.has(BY_ID.get(a).t) - PROVENANCE.has(BY_ID.get(b).t));
  const shown = ids.slice(0, MAX_NEIGHBOURS);
  const set = new Set([id, ...shown]);
  // Add edges among neighbours too, so claim, assertion and technique form visible triangles.
  const links = [];
  const seen = new Set();
  for (const nid of set) for (const [p, o] of OUT.get(nid)) {
    if (!set.has(o)) continue;
    const pair = [nid, o].sort().join("|");
    if (seen.has(pair)) continue;
    seen.add(pair);
    links.push({source: nid, target: o, label: propLabel(p)});
  }
  return {nodes: [...set].map(x => nodeView(BY_ID.get(x))), links, total: ids.length, shown: shown.length};
}

function overview() {
  const groups = ofType("CapabilityGroup"), controls = ofType("SecurityControl");
  const nodes = [...groups.map(g => ({...nodeView(g), short: g.s, label: true, size: 700})),
    ...controls.map(c => { const m = mitigated(c.id); return {...nodeView(c), size: 60 + Math.sqrt(m) * 120, dim: m === 0, label: m >= 10}; })];
  const links = controls.flatMap(c => OUT.get(c.id).filter(([p]) => p === ":inCapabilityGroup").map(([, g]) => ({source: c.id, target: g})));
  draw(nodes, links, null, {distance: l => 24 + radius(l.source.size) + radius(l.target.size) * 0.4, charge: -70, collide: d => radius(d.size) + 3});
}

function schemaGraph(focus) {
  const classes = DATA.schema.classes;
  const known = new Set(classes.filter(c => !c.deprecated).map(c => c.id));
  const nodes = classes.filter(c => !c.deprecated).map(c => ({id: c.id, t: "Class", l: c.label ?? c.id, short: c.label ?? c.id, href: "class/" + encodeURIComponent(c.id), label: true,
    sym: d3.symbolSquare, size: 420, fill: c.id === focus ? "var(--focus)" : (c.id.startsWith(":") ? "var(--accent)" : "var(--nonmap)")}));
  const add = new Set();
  const links = [];
  for (const c of classes.filter(c => !c.deprecated)) for (const s of c.super) {
    if (!known.has(s)) { if (!add.has(s)) { add.add(s); nodes.push({id: s, t: "Class", l: s, short: s, href: "schema", label: true, sym: d3.symbolSquare, size: 300, fill: "var(--nonmap)"}); } }
    links.push({source: c.id, target: s, label: "subClassOf"});
  }
  for (const p of DATA.schema.properties) if (p.kind === "object" && known.has(p.domain) && known.has(p.range) && !(p.inverse && p.id > p.inverse && PROPS.get(p.inverse)?.domain === p.range))
    links.push({source: p.domain, target: p.range, label: p.label ?? p.id});
  draw(nodes, links, focus, {distance: 150, charge: -700, collide: 40, labels: true, pull: 0.12});
}

function questionGraph(q) {
  const ids = new Set();
  for (const m of q.sparql.matchAll(/data:([A-Za-z0-9_.-]+)/g)) if (BY_ID.has(m[1])) ids.add(m[1]);
  for (const row of q.rows.slice(0, 80)) for (const v of row) { const id = cellId(v); if (id) ids.add(id); }
  const set = new Set([...ids].slice(0, 120));
  if (set.size < 2) return overview();
  const links = [];
  for (const id of set) for (const [p, o] of OUT.get(id)) if (set.has(o)) links.push({source: id, target: o, label: propLabel(p)});
  draw([...set].map(x => nodeView(BY_ID.get(x))), links, null, {labels: set.size <= 60});
}
function cellId(v) {
  if (v == null) return null;
  if (BY_ID.has(v)) return v;
  for (const [re, prefix] of [[/^[A-Z]{2}-[0-9]{2}$/, "control_"], [/^T[0-9]{4}(\.[0-9]{3})?$/, "technique_"], [/^M[0-9]{4}$/, "mitigation_"], [/^TA[0-9]{4}$/, "tactic_"]])
    if (re.test(v) && BY_ID.has(prefix + v)) return prefix + v;
  return null;
}
function showQuestions() {
  detail.innerHTML = `<h2>Competency questions</h2>
    <p>What the graph must be able to answer, following the competency-question method in the ontology engineering guide. Each question is a SPARQL file in <code>queries/</code>; the tests check every answer against the same answer computed from the raw source files.</p>
    <ul class="list">${QUESTIONS.map(q => `<li><a href="#q/${q.id}"><span class="id">${q.id}</span><span class="sub">${esc(q.question)}</span><span class="count">${q.total}</span></a></li>`).join("")}</ul>`;
  overview();
  crumb("Competency questions");
}
function showQuestion(id) {
  const q = QUESTIONS.find(x => x.id === id);
  if (!q) return showQuestions();
  const cellHtml = v => { const nid = cellId(v); return nid ? link(nid).split("</a>")[0] + "</a>" : esc(v ?? ""); };
  detail.innerHTML = `<span class="badge">${esc(q.id)}</span> <span class="note">${esc(q.persona)}</span>
    <h2>${esc(q.question)}</h2>
    <dl><dt>Decision</dt><dd>${esc(q.decision)}</dd><dt>Evidence</dt><dd>${esc(q.evidence)}</dd><dt>Answer</dt><dd>${q.total} row${q.total === 1 ? "" : "s"}${q.total > q.rows.length ? `, first ${q.rows.length} shown` : ""}</dd></dl>
    <h3>Answer</h3><div style="overflow:auto"><table><thead><tr>${q.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${q.rows.map(r => `<tr>${r.map(v => `<td>${cellHtml(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <div class="row"><button class="btn" id="q-csv">Download CSV</button> <a class="note" href="exports/questions/${q.id.toLowerCase()}.csv">Stable link to this CSV</a></div>
    <details><summary>SPARQL</summary><pre>${esc(q.sparql)}</pre><p class="note"><a href="https://github.com/mmccalla/nist-attack-enterprise-ontology/blob/main/${esc(q.file)}">${esc(q.file)}</a></p></details>
    <p><a href="#questions">All questions</a></p>`;
  questionGraph(q);
  document.getElementById("q-csv").addEventListener("click", () => download(`${q.id.toLowerCase()}.csv`, toCsv(q.columns, q.rows), "text/csv"));

}

/* Exports: ATT&CK Navigator layers and CSV, built in the browser */
const SITE = "https://mmccalla.github.io/nist-attack-enterprise-ontology/";
const C2 = NistAttackCoverage;  // shared logic: lib/coverage.cjs
const STATUS = C2.STATUS_COLOURS;
const ENTERPRISE = ofType("AttackTechnique").filter(n => n.p[":inAttackEnterprise"] === "true");
const CONTROLS = new Map(ofType("SecurityControl").map(n => [n.l, n]));
const tacticsOf = id => OUT.get(id).filter(([p]) => p === ":inTactic").map(([, o]) => BY_ID.get(o));
const controlsFor = id => IN.get(id).filter(([p]) => p === ":mitigatesTechnique").map(([, s]) => BY_ID.get(s).l).sort();
const baselinesOf = id => OUT.get(id).filter(([p]) => p === ":inBaseline").map(([, o]) => BY_ID.get(o).l).sort();
const byTid = C2.byTechniqueId;
const MODEL = {
  techniques: ENTERPRISE.map(t => ({id: t.l, name: t.s, tactics: tacticsOf(t.id).map(x => x.p[":tacticShortName"])})),
  controls: Object.fromEntries([...CONTROLS].map(([cid, n]) => [cid, {title: n.s, baselines: baselinesOf(n.id)}])),
  mitigates: Object.fromEntries([...CONTROLS].map(([cid, n]) => [cid, OUT.get(n.id).filter(([p]) => p === ":mitigatesTechnique").map(([, o]) => BY_ID.get(o).l)])),

const coverage = selected => C2.coverage(MODEL, selected);
const navigatorLayer = (name, description, selected) => C2.navigatorLayer(MODEL, name, description, selected);
const csvCell = v => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
const toCsv = (header, rows) => [header, ...rows].map(r => r.map(csvCell).join(",")).join("\n") + "\n";
function download(filename, text, type) {
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = Object.assign(document.createElement("a"), {href: url, download: filename});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const downloadLayer = (filename, layer) => download(filename, JSON.stringify(layer, null, 2) + "\n", "application/json");
const slugName = s => s.replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase();

      <thead><tr><th>Tactic</th><th>Coverage</th><th class="num">&#10003;</th><th class="num">!</th><th class="num">&#9675;</th><th class="num">%</th></tr></thead>
      <tbody>${tactics.map(([ta, c]) => { const d = c.covered + c.gap + c.none; return `<tr><td>${link(ta.id).split("</a>")[0]}</a> ${esc(ta.s)}</td>

        <td class="num">${c.covered}</td><td class="num">${c.gap}</td><td class="num">${c.none}</td><td class="num">${pct(c.covered, d)}</td></tr>`; }).join("")}</tbody></table>
    <h3>Gaps a mapped control would close (${gaps.length})</h3>
    ${gaps.length ? `<table><thead><tr><th>Technique</th><th>Name</th><th>Controls that would mitigate it</th></tr></thead><tbody>${gaps.slice(0, 300).map(([tid, [, cs]]) => `<tr><td>${link("technique_" + tid).split("</a>")[0]}</a></td><td>${esc(BY_ID.get("technique_" + tid).s)}</td><td>${cs.map(c => `<a href="#n/control_${c}">${c}</a>`).join(" ")}</td></tr>`).join("")}</tbody></table>${gaps.length > 300 ? `<p class="note">First 300 shown; the CSV has all ${gaps.length}.</p>` : ""}` : `<p>None: every technique that has a mapped control is covered by your selection.</p>`}
    <p class="note">${counts.none} techniques have no mitigating control in the mapping (non-mappable rows and techniques the mapping does not mention). Selecting more NIST controls cannot cover them; see <a href="#q/CQ05">CQ05</a> and <a href="#q/CQ12">CQ12</a>.</p>`;

function renderGapPanel(result) {

/* Gap analysis for AI systems: ATLAS mitigations against ATLAS techniques (same shared logic) */
const ATLAS_T = ofType("AtlasTechnique");
const ATLAS_M = new Map(ofType("AtlasMitigation").map(n => [n.l, n]));
const atlasTactics = id => {
  const own = OUT.get(id).filter(([p]) => p === ":inTactic").map(([, o]) => o);
  if (own.length) return own;
  const parent = OUT.get(id).find(([p]) => p === ":subTechniqueOf");
  return parent ? OUT.get(parent[1]).filter(([p]) => p === ":inTactic").map(([, o]) => o) : [];
};
function atlasModel(agentOnly) {
  const techniques = ATLAS_T.filter(t => !agentOnly || t.p[":isAgentRelated"] === "true");
  const ids = new Set(techniques.map(t => t.l));
  return {
    techniques: techniques.map(t => ({id: t.l, name: t.s, tactics: atlasTactics(t.id)})),
    controls: Object.fromEntries([...ATLAS_M].map(([mid, n]) => [mid, {title: n.s, baselines: []}])),
    mitigates: Object.fromEntries([...ATLAS_M].map(([mid, n]) => [mid, OUT.get(n.id).filter(([p]) => p === ":atlasMitigationFor").map(([, o]) => BY_ID.get(o).l).filter(t => ids.has(t))])),
  };
}

    const total = cov.size, pct = n => total ? Math.round(100 * n / total) : 0;

  document.getElementById("atlas-recs-csv").addEventListener("click", () => {

    download("atlas-recommended-mitigations.csv", toCsv(["rank", "mitigation_id", "mitigation_name", "gaps_closed"],

/* Routing */
function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (h.startsWith("n/")) return {view: "node", id: h.slice(2)};
  if (h.startsWith("class/")) return {view: "class", id: h.slice(6)};
  if (h.startsWith("q/")) return {view: "question", id: h.slice(2)};
  if (h === "gaps" || h.startsWith("gaps/")) return {view: "gaps", list: h.startsWith("gaps/") ? h.slice(5) : null};
  if (h === "gaps-atlas" || h.startsWith("gaps-atlas/")) return {view: "gaps-atlas", list: h.startsWith("gaps-atlas/") ? h.slice(11) : null};
  return {view: ["schema", "about", "questions"].includes(h) ? h : "overview"};
}
function crumb(t) { document.getElementById("crumb").textContent = t; }
function go() {
  const r = route();
  const gapsView = r.view === "gaps" || r.view === "gaps-atlas";
  document.getElementById("report").hidden = !gapsView;
  for (const id of ["graph", "legend", "toolbar"]) document.getElementById(id).style.visibility = gapsView ? "hidden" : "";
  const navView = {class: "schema", question: "questions", "gaps-atlas": "gaps"}[r.view] ?? r.view;
  document.querySelectorAll("header nav a[data-view]").forEach(a => a.toggleAttribute("aria-current", a.dataset.view === navView));
  document.querySelectorAll("header nav a[aria-current]").forEach(a => a.setAttribute("aria-current", "page"));
  if (r.view === "node" && BY_ID.has(r.id)) showNode(r.id);
  else if (r.view === "class") showClass(r.id);
  else if (r.view === "schema") showSchema();
  else if (r.view === "about") showAbout();
  else if (r.view === "questions") showQuestions();
  else if (r.view === "gaps") showGaps(r.list);
  else if (r.view === "gaps-atlas") showGapsAtlas(r.list);
  else if (r.view === "question") showQuestion(r.id);
  else showOverview();
  document.title = `${document.getElementById("crumb").textContent.split(".")[0]} | NIST 800-53 to ATT&CK ontology`;
  renderBrowse();
  detail.scrollTop = 0;
}
document.getElementById("prov").addEventListener("change", go);
addEventListener("hashchange", go);
addEventListener("resize", () => { clearTimeout(window.__r); window.__r = setTimeout(go, 200); });
go();
</script>
</body>
